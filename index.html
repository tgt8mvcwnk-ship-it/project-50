<!doctype html>

<html lang="en">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>PROJECT 50</title>

<style>

*{box-sizing:border-box}

body{

  margin:0;

  background:#070b1c;

  color:#fff;

  font-family:Arial,sans-serif

}

main{

  width:92%;

  max-width:720px;

  margin:auto;

  padding:45px 0 80px

}

.logo{

  color:#9fa9d8;

  letter-spacing:2px;

  margin-bottom:22px

}

h1{

  font-size:48px;

  line-height:1.08;

  margin:0 0 18px

}

.intro{

  font-size:20px;

  line-height:1.5;

  color:#c0c7ef;

  margin-bottom:30px

}

button{

  border:0;

  border-radius:16px;

  font-weight:700;

  font-size:18px;

  cursor:pointer

}

.start{

  padding:18px 26px;

  background:#fff;

  color:#080b19

}

h2{

  font-size:30px;

  margin-top:60px

}

.menu{

  display:grid;

  gap:14px

}

.choice{

  padding:21px;

  background:#171d3a;

  color:#fff;

  border:1px solid #39436d;

  text-align:left

}

.choice.active{

  background:#29345f

}

.panel{

  display:none;

  background:#151b36;

  padding:25px;

  border-radius:22px;

  margin-top:20px

}

.panel.show{

  display:block

}

label{

  display:block;

  margin:15px 0 7px;

  color:#cbd2ef

}

input,select,textarea{

  width:100%;

  padding:15px;

  border-radius:12px;

  border:1px solid #3a456d;

  background:#0b1126;

  color:#fff;

  font-size:16px

}

textarea{

  min-height:85px

}

.go{

  width:100%;

  padding:17px;

  margin-top:20px;

  background:#fff;

  color:#080b19

}

.result{

  display:none;

  margin-top:20px;

  padding:20px;

  border-radius:16px;

  background:#0b1126;

  line-height:1.55;

  white-space:pre-wrap

}

.result.show{

  display:block

}

.result strong{

  color:#aeb7ff

}

footer{

  margin-top:65px;

  color:#7f89ad;

  text-align:center;

  font-size:13px

}

</style>

</head>

<body>

<main>

<div class="logo">PROJECT 50 • MVP</div>

<h1>Improve your money or time in one small step.</h1>

<div class="intro">

Choose what you need today and get a quick personalized action plan.

</div>

<button

class="start"

onclick="document.getElementById('tools').scrollIntoView({behavior:'smooth'})">

Start now

</button>

<section id="tools">

<h2>What do you want to improve?</h2>

<div class="menu">

<button class="choice" onclick="openTool('make',this)">

💰 Make extra money

</button>

<button class="choice" onclick="openTool('save',this)">

💵 Save money

</button>

<button class="choice" onclick="openTool('buy',this)">

🛍 Find a better price

</button>

<button class="choice" onclick="openTool('time',this)">

⚡ Save time

</button>

</div>

<div class="panel" id="make">

<h3>💰 Make extra money</h3>

<label>Your goal</label>

<input id="goal" type="number" placeholder="300">

<label>Deadline</label>

<select id="deadline">

<option value="1">Today</option>

<option value="2">This weekend</option>

<option value="7">Within 7 days</option>

<option value="30">Within 30 days</option>

</select>

<label>Skills or resources</label>

<textarea

id="skills"

placeholder="Driving, sales, handyman, computer, car..."></textarea>

<button class="go" onclick="makeMoney()">

Build my plan

</button>

<div class="result" id="makeResult"></div>

</div>

<div class="panel" id="save">

<h3>💵 Save money</h3>

<label>Expense</label>

<select id="expense">

<option>Phone</option>

<option>Internet</option>

<option>Car insurance</option>

<option>Home insurance</option>

<option>Subscriptions</option>

<option>Credit cards</option>

<option>Other</option>

</select>

<label>Monthly cost</label>

<input id="monthly" type="number" placeholder="200">

<button class="go" onclick="saveMoney()">

Check savings

</button>

<div class="result" id="saveResult"></div>

</div>

<div class="panel" id="buy">

<h3>🛍 Better price</h3>

<label>Product</label>

<input id="product" placeholder="AirPods Pro">

<label>Current price</label>

<input id="price" type="number" placeholder="249">

<button class="go" onclick="checkPrice()">

Check this deal

</button>

<div class="result" id="buyResult"></div>

</div>

<div class="panel" id="time">

<h3>⚡ Save time</h3>

<label>Task</label>

<textarea

id="task"

placeholder="Emails, invoices, routes, research..."></textarea>

<label>Hours per week</label>

<input id="hours" type="number" placeholder="5">

<button class="go" onclick="saveTime()">

Find a faster way

</button>

<div class="result" id="timeResult"></div>

</div>

</section>

<footer>

PROJECT 50 • Small value. Massive scale.

</footer>

</main>

<script>

function openTool(id,b){

  document.querySelectorAll('.panel')

    .forEach(x=>x.classList.remove('show'));

  document.querySelectorAll('.choice')

    .forEach(x=>x.classList.remove('active'));

  document.getElementById(id).classList.add('show');

  b.classList.add('active');

}

function cash(n){

  return '$'+Math.round(n).toLocaleString();

}

async function makeMoney(){

  const goal=+document.getElementById('goal').value;

  const days=+document.getElementById('deadline').value;

  const skills=document.getElementById('skills').value;

  const box=document.getElementById('makeResult');

  if(!goal){

    box.className='result show';

    box.textContent='Enter your income goal first.';

    return;

  }

  box.className='result show';

  box.textContent='AI is building your personalized plan...';

  try{

    const response=await fetch('/api/plan',{

      method:'POST',

      headers:{

        'Content-Type':'application/json'

      },

      body:JSON.stringify({

        goal:goal,

        deadline:days,

        skills:skills

      })

    });

    const raw=await response.text();

    let data;

    try{

      data=JSON.parse(raw);

    }catch(e){

      throw new Error(

        'Server returned an unexpected response.\n\n' +

        'HTTP '+response.status+'\n\n' +

        raw.slice(0,500)

      );

    }

    if(!response.ok){

      throw new Error(

        data.error ||

        'Server error '+response.status

      );

    }

    if(!data.plan){

      throw new Error(

        'AI responded, but no plan was returned.'

      );

    }

    box.textContent=data.plan;

  }catch(error){

    box.textContent=

      'AI connection error.\n\n'+

      error.message;

  }

}

function saveMoney(){

  let cost=+document.getElementById('monthly').value;

  let type=document.getElementById('expense').value;

  let box=document.getElementById('saveResult');

  if(!cost){

    box.className='result show';

    box.innerHTML='Enter your monthly cost first.';

    return;

  }

  box.className='result show';

  box.innerHTML=

    '<strong>'+type+'</strong><br>'+

    'Current: '+cash(cost)+'/month<br><br>'+

    'First savings target: <strong>'+

    cash(cost*.10)+'–'+cash(cost*.25)+

    '/month</strong>.<br><br>'+

    'Compare 3 competing offers, then ask your current provider to match the best one.';

}

function checkPrice(){

  let product=document.getElementById('product').value;

  let price=+document.getElementById('price').value;

  let box=document.getElementById('buyResult');

  if(!product||!price){

    box.className='result show';

    box.innerHTML='Enter the product and price first.';

    return;

  }

  box.className='result show';

  box.innerHTML=

    '<strong>FIND CHEAPER</strong><br>'+

    product+' at '+cash(price)+'.<br><br>'+

    'Try to find it at <strong>'+

    cash(price*.88)+

    ' or less</strong> before buying.<br>'+

    'Potential target saving: <strong>'+

    cash(price*.12)+'</strong>.';

}

function saveTime(){

  let task=document.getElementById('task').value;

  let hours=+document.getElementById('hours').value;

  let box=document.getElementById('timeResult');

  if(!task||!hours){

    box.className='result show';

    box.innerHTML='Enter the task and weekly hours first.';

    return;

  }

  box.className='result show';

  box.innerHTML=

    '<strong>Your target:</strong> recover about '+

    (hours*.4).toFixed(1)+

    ' hours/week.<br><br>'+

    'Break "'+task+

    '" into 3 repeated steps. Template, batch or automate the most repetitive step first.';

}

</script>

</body>

</html>
